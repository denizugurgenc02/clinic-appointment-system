services:
  app:
    build: .
    container_name: clinic_app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-0}
      # Boşsa config/app.php içindeki varsayılan (asdf1234) kullanılır
      SUPER_ADMIN_PASSWORD_HASH: ${SUPER_ADMIN_PASSWORD_HASH:-}
      APP_PORT: ${APP_PORT:-8000}

# Aşama 3'te MySQL servisi (db) buraya eklenecek. Aşama 2'de veri storage/data/*.json dosyalarındadır.
