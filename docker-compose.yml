services:
  app:
    build: .
    container_name: clinic_app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-1}

# Aşama 3'te MySQL servisi (db) buraya eklenecek. Aşama 2'de veri storage/data/*.json dosyalarındadır.
